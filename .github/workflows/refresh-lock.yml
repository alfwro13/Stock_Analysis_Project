name: Refresh dependency lock

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [requirements.txt]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv==0.13.1

      - name: Regenerate requirements.lock
        run: uv pip compile requirements.txt --universal --python-version 3.13 --generate-hashes -o requirements.lock

      - name: Publish the new lock
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- requirements.lock; then
            echo "requirements.lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            git add requirements.lock
            git commit -m "Regenerate requirements.lock"
            git push origin "HEAD:$REF_NAME"
            echo "Pushed the lock to $REF_NAME. Close and reopen its pull request to start the tests."
            exit 0
          fi
          git checkout -B refresh-lock
          git add requirements.lock
          git commit -m "Regenerate requirements.lock"
          git push --force origin refresh-lock
          link="https://github.com/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...refresh-lock?expand=1"
          echo "Pushed refresh-lock. Open the pull request: $link"
          echo "requirements.lock was regenerated on branch refresh-lock. [Open the pull request]($link)." >> "$GITHUB_STEP_SUMMARY"
