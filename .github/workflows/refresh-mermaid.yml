name: Refresh vendored Mermaid

on:
  workflow_dispatch:
  pull_request:
    paths: [package.json]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event_name != 'pull_request' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: false

      - name: Vendor the Mermaid version declared in package.json
        id: vendor
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "::error::Run this workflow on a branch, not on $DEFAULT_BRANCH."
            exit 1
          fi
          version=$(jq -r '.dependencies.mermaid' package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json must pin mermaid to an exact x.y.z version, found '$version'."
            exit 1
          fi
          target="static/vendor/mermaid/mermaid-${version}.min.js"
          if [ ! -f "$target" ]; then
            work=$(mktemp -d)
            (cd "$work" && npm pack "mermaid@${version}" --ignore-scripts --silent && tar -xzf "mermaid-${version}.tgz" package/dist/mermaid.min.js)
            cp "$work/package/dist/mermaid.min.js" "$target"
          fi
          find static/vendor/mermaid -name 'mermaid-*.min.js' ! -name "mermaid-${version}.min.js" -delete
          sed -i -E "s#/static/vendor/mermaid/mermaid-[0-9]+\.[0-9]+\.[0-9]+\.min\.js#/static/vendor/mermaid/mermaid-${version}.min.js#" templates/settings.html
          git add -A static/vendor/mermaid templates/settings.html
          if git diff --cached --quiet; then
            echo "The vendored Mermaid already matches package.json ($version)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import pathlib, re
          path = pathlib.Path("constants.py")
          text = path.read_text()
          text, count = re.subn(r'CSS_VERSION = "(\d+)\.(\d+)"', lambda m: f'CSS_VERSION = "{m.group(1)}.{int(m.group(2)) + 1}"', text, count=1)
          assert count == 1, "CSS_VERSION not found in constants.py"
          path.write_text(text)
          PY
          git add constants.py
          sha=$(sha256sum "$target" | cut -d' ' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish the vendored file
        if: steps.vendor.outputs.changed == 'true'
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_TOKEN: ${{ github.token }}
          LOCK_REFRESH_TOKEN: ${{ secrets.LOCK_REFRESH_TOKEN }}
          VERSION: ${{ steps.vendor.outputs.version }}
          SHA256: ${{ steps.vendor.outputs.sha256 }}
        run: |
          set -euo pipefail
          # A push made with the workflow token does not start tests.yml; a PAT push does.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "$LOCK_REFRESH_TOKEN" ]; then
              echo "::error::Dependabot secret LOCK_REFRESH_TOKEN is missing (Settings > Secrets and variables > Dependabot)."
              exit 1
            fi
            push_token="$LOCK_REFRESH_TOKEN"
          else
            push_token="$WORKFLOW_TOKEN"
          fi
          remote="https://x-access-token:${push_token}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Vendor Mermaid ${VERSION}" -m "dist/mermaid.min.js from the npm package, SHA-256 ${SHA256}."
          git push "$remote" "HEAD:refs/heads/$REF_NAME"
          echo "Vendored Mermaid ${VERSION} (SHA-256 ${SHA256}) on $REF_NAME. Check the Workflow Monitor graph before merging." >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Close and reopen the branch's pull request to start the tests."
          fi
