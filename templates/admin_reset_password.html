<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Quantamental - Admin Password Reset</title>
    <link rel="stylesheet" href="/static/css/styles.css?v={{ css_version }}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            background: var(--card-bg, #1e1e2e);
            border-radius: 14px;
            border: 1px solid var(--border-color, #333);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .login-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.75rem;
        }
        .login-logo img { width: 36px; height: 36px; }
        .login-logo span { font-size: 1.2rem; font-weight: 600; letter-spacing: 0.01em; }
        .login-field { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
        .login-field label { font-size: 0.82rem; color: var(--text-muted, #aaa); }
        .login-field input {
            padding: 0.6rem 0.8rem;
            border-radius: 7px;
            border: 1px solid var(--border-color, #444);
            background: var(--input-bg, #111);
            color: inherit;
            font-size: 0.97rem;
            transition: border-color 0.15s;
        }
        .login-field input:focus { outline: none; border-color: #4f8ef7; }
        .login-btn {
            width: 100%;
            padding: 0.7rem;
            border-radius: 7px;
            border: none;
            background: #4f8ef7;
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 0.5rem;
        }
        .login-btn:hover { background: #3a75d4; }
        .login-btn:disabled { background: #2a4a7f; cursor: not-allowed; }
        .login-msg {
            margin-top: 1rem;
            padding: 0.55rem 0.8rem;
            border-radius: 6px;
            font-size: 0.88rem;
            display: none;
        }
        .login-msg.error { background: #3d1a1a; color: #f87171; }
        .login-msg.success { background: #1a3d1a; color: #4ade80; }
        .warning-banner {
            background: #3d2a00;
            border: 1px solid #a16207;
            border-radius: 7px;
            padding: 0.7rem 0.9rem;
            font-size: 0.85rem;
            color: #fbbf24;
            margin-bottom: 1.4rem;
        }
        .page-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.3rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <img src="/assets/logo_small.png" alt="Logo">
            <span>Quantamental</span>
        </div>

        <p class="page-title">Admin Password Reset</p>
        <div class="warning-banner">
            This page is accessible because <code>FORCE_PASSWORD_RESET</code> is enabled in
            <code>config.json</code>. Set a new password below — the flag will be cleared automatically.
        </div>

        <form id="adminResetForm">
            <div class="login-field">
                <label for="new_password">New password</label>
                <input type="password" id="new_password" autocomplete="new-password" autofocus required>
            </div>
            <div class="login-field">
                <label for="confirm_password">Confirm new password</label>
                <input type="password" id="confirm_password" autocomplete="new-password" required>
            </div>
            <button type="submit" class="login-btn" id="resetBtn">Set Password</button>
        </form>

        <div id="msg" class="login-msg"></div>
    </div>

    <script>
        document.getElementById('adminResetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('resetBtn');
            const msg = document.getElementById('msg');
            btn.disabled = true;
            btn.textContent = 'Saving…';
            const res = await fetch('/api/admin-reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    new_password: document.getElementById('new_password').value,
                    confirm_password: document.getElementById('confirm_password').value,
                }),
            });
            const data = await res.json().catch(() => ({}));
            if (res.ok) {
                msg.textContent = 'Password updated. Redirecting to login…';
                msg.className = 'login-msg success';
                msg.style.display = 'block';
                setTimeout(() => { window.location.href = '/login'; }, 1800);
            } else {
                msg.textContent = data.detail || 'Failed to reset password.';
                msg.className = 'login-msg error';
                msg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Set Password';
            }
        });
    </script>
</body>
</html>
