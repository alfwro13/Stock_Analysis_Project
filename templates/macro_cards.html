<link rel="stylesheet" href="/static/css/styles.css">

{% if show_indexes %}
<div id="macro-status" class="macro-pulse-indicator">
    <span id="pulse-dot" class="pulse-dot"></span> <span id="pulse-text">Live Market Pulse Active</span>
</div>
<div id="macro-cards-container" class="macro-container">
</div>
{% endif %}

<script>
    let marketPulseInterval;
    let isFastPolling = false;
    const REFRESH_RATE_MS = (window.REFRESH_RATE_MS || 60000); 
    const FAST_POLL_MS = 3000; // Check every 3 seconds while waiting for background refresh

    // --- BROWSER NOTIFICATIONS LOGIC ---
    let lastNotificationId = null;

    async function initBrowserNotifications() {
        if (!("Notification" in window)) {
            console.log("This browser does not support desktop notifications.");
            return;
        }
        // If not explicitly granted or denied, request it
        if (Notification.permission !== "granted" && Notification.permission !== "denied") {
            Notification.requestPermission();
        }
    }

    async function pollSystemNotifications() {
        if (Notification.permission !== "granted") return;

        try {
            const response = await fetch(`/api/notifications/latest?last_id=${lastNotificationId || 0}`);
            const result = await response.json();
            
            if (response.ok && result.status === 'success') {
                const notes = result.notifications;
                if (notes.length > 0) {
                    if (lastNotificationId === null) {
                        // First load: just set baseline to highest ID to avoid spamming old unread alerts
                        lastNotificationId = notes[notes.length - 1].id;
                    } else {
                        // Subsequent polls: trigger native notifications
                        notes.forEach(note => {
                            const notification = new Notification(`🚨 Quantamental: ${note.type} Alert`, {
                                body: note.text.substring(0, 120) + (note.text.length > 120 ? '...' : ''),
                                icon: '/assets/logo_small.png'
                            });
                            
                            // Click the native notification to open the dashboard notifications page
                            notification.onclick = function() {
                                window.open("/notifications", "_blank");
                                notification.close();
                            };
                            
                            lastNotificationId = Math.max(lastNotificationId, note.id);
                        });
                        
                        // Dynamically update the top navbar badge if it exists
                        const badge = document.getElementById('nav-badge');
                        if (badge) {
                            badge.innerText = parseInt(badge.innerText || '0') + notes.length;
                            badge.style.display = 'inline-block';
                        }
                    }
                } else if (lastNotificationId === null) {
                    lastNotificationId = 0; // Baseline if DB is entirely empty
                }
            }
        } catch (error) {
            console.error("Failed to poll system notifications:", error);
        }
    }
    // -----------------------------------

    async function fetchMarketPulse() {
        try {
            // Run the notification poll concurrently with the pulse fetch
            pollSystemNotifications();

            let requestedTickers = [];
            if (window.ENABLE_LIVE_ASSETS) {
                const rows = document.querySelectorAll('.live-asset-row');
                rows.forEach(row => {
                    const ticker = row.getAttribute('data-ticker');
                    if (ticker) requestedTickers.push(ticker);
                });
            }

            const response = await fetch('/api/market-pulse', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ tickers: requestedTickers })
            });
            
            const result = await response.json();
            
            if (response.ok && result.status === 'success') {
                const indexes = result.data.indexes || [];
                const assets = result.data.assets || [];
                
                let anyStale = false;

                {% if show_indexes %}
                renderMacroCards(indexes);
                const pulseDot = document.getElementById('pulse-dot');
                const pulseText = document.getElementById('pulse-text');
                {% endif %}
                
                // Track if any element is stale to update UI status correctly
                indexes.forEach(idx => { if(idx.is_stale) anyStale = true; });
                assets.forEach(asset => { if(asset.is_stale) anyStale = true; });

                {% if show_indexes %}
                if (pulseDot && pulseText) {
                    pulseDot.classList.remove('offline');
                    if (anyStale) {
                        pulseText.innerText = "Loaded cached data. Fetching fresh data in background...";
                        pulseDot.style.backgroundColor = "#aaa";
                        pulseDot.style.boxShadow = "0 0 5px #aaa";
                    } else {
                        pulseText.innerText = "Live Market Pulse Active";
                        pulseDot.style.backgroundColor = "#00ffcc";
                        pulseDot.style.boxShadow = "0 0 5px #00ffcc";
                    }
                }
                {% endif %}
                
                updateAssetPrices(assets);

                // --- DYNAMIC POLLING LOGIC ---
                if (anyStale && !isFastPolling) {
                    // Enter fast-polling mode while backend is fetching
                    clearInterval(marketPulseInterval);
                    marketPulseInterval = setInterval(fetchMarketPulse, FAST_POLL_MS);
                    isFastPolling = true;
                } else if (!anyStale && isFastPolling) {
                    // Background fetch completed! Return to the user's standard slow refresh rate
                    clearInterval(marketPulseInterval);
                    marketPulseInterval = setInterval(fetchMarketPulse, REFRESH_RATE_MS);
                    isFastPolling = false;
                }
                
            } else {
                handlePulseError();
            }
        } catch (error) {
            handlePulseError();
        }
    }

    function renderMacroCards(data) {
        const container = document.getElementById('macro-cards-container');
        if (!container) return;
        
        container.innerHTML = ''; 
        
        data.forEach(index => {
            const isPos = index.is_positive;
            const cardClass = isPos ? 'positive' : 'negative';
            const changeClass = isPos ? 'positive' : 'negative';
            const sign = isPos ? '+' : '';
            
            // Assign transparent gray classes if the DB data is older than refresh rate
            const staleClass = index.is_stale ? 'stale-card' : '';
            const staleText = index.is_stale ? 'stale-text' : '';
            
            const cardHTML = `
                <div class="macro-card ${cardClass} ${staleClass}">
                    <div class="macro-title ${staleText}">${index.name}</div>
                    <div class="macro-price ${staleText}">${index.price}</div>
                    <div class="macro-change ${changeClass} ${staleText}">
                        ${sign}${index.change_pct}%
                    </div>
                </div>
            `;
            container.innerHTML += cardHTML;
        });
    }

    function updateAssetPrices(assets) {
        assets.forEach(asset => {
            const priceEl = document.getElementById('price-' + asset.ticker);
            const changeEl = document.getElementById('change-' + asset.ticker);
            
            if (priceEl && changeEl) {
                priceEl.innerText = asset.price;
                const sign = asset.is_positive ? '+' : '';
                changeEl.innerText = `${sign}${asset.change_pct}%`;
                
                if (asset.is_stale) {
                    changeEl.className = 'stale-text';
                    priceEl.className = 'stale-text';
                } else {
                    changeEl.className = asset.is_positive ? 'trend-up' : 'trend-down';
                    priceEl.className = '';
                }
            }
        });
    }

    function handlePulseError() {
        {% if show_indexes %}
        const pulseDot = document.getElementById('pulse-dot');
        if (pulseDot) {
            pulseDot.classList.add('offline');
            document.getElementById('pulse-text').innerText = "Market Pulse Offline (Retrying...)";
        }
        {% endif %}
    }

    function startPulseEngine() {
        fetchMarketPulse();
        // Start with whichever interval state we are currently in
        marketPulseInterval = setInterval(fetchMarketPulse, isFastPolling ? FAST_POLL_MS : REFRESH_RATE_MS);
    }

    function stopPulseEngine() {
        clearInterval(marketPulseInterval);
        {% if show_indexes %}
        const pulseDot = document.getElementById('pulse-dot');
        if (pulseDot) {
            pulseDot.classList.add('offline');
            document.getElementById('pulse-text').innerText = "Market Pulse Paused (Tab Inactive)";
        }
        {% endif %}
    }

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            stopPulseEngine();
        } else {
            startPulseEngine();
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        initBrowserNotifications();
        if (!document.hidden) {
            startPulseEngine();
        }
    });
</script>
