<link rel="stylesheet" href="/static/css/styles.css">

{% if show_indexes %}
<div id="macro-status" class="macro-pulse-indicator">
    <span id="pulse-dot" class="pulse-dot"></span> <span id="pulse-text">Live Market Pulse Active</span>
</div>
<div id="macro-cards-container" class="macro-container">
</div>
{% endif %}

<script>
    let marketPulseInterval;
    const REFRESH_RATE_MS = (window.REFRESH_RATE_MS || 60000); 

    async function fetchMarketPulse() {
        try {
            let requestedTickers = [];
            if (window.ENABLE_LIVE_ASSETS) {
                const rows = document.querySelectorAll('.live-asset-row');
                rows.forEach(row => {
                    const ticker = row.getAttribute('data-ticker');
                    if (ticker) requestedTickers.push(ticker);
                });
            }

            const response = await fetch('/api/market-pulse', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ tickers: requestedTickers })
            });
            
            const result = await response.json();
            
            if (response.ok && result.status === 'success') {
                const indexes = result.data.indexes || [];
                const assets = result.data.assets || [];
                
                {% if show_indexes %}
                renderMacroCards(indexes);
                const pulseDot = document.getElementById('pulse-dot');
                if (pulseDot) {
                    pulseDot.classList.remove('offline');
                    document.getElementById('pulse-text').innerText = "Live Market Pulse Active";
                }
                {% endif %}
                
                updateAssetPrices(assets);
                
            } else {
                handlePulseError();
            }
        } catch (error) {
            handlePulseError();
        }
    }

    function renderMacroCards(data) {
        const container = document.getElementById('macro-cards-container');
        if (!container) return;
        
        container.innerHTML = ''; 
        
        data.forEach(index => {
            const isPos = index.is_positive;
            const cardClass = isPos ? 'positive' : 'negative';
            const changeClass = isPos ? 'positive' : 'negative';
            const sign = isPos ? '+' : '';
            
            const cardHTML = `
                <div class="macro-card ${cardClass}">
                    <div class="macro-title">${index.name}</div>
                    <div class="macro-price">${index.price}</div>
                    <div class="macro-change ${changeClass}">
                        ${sign}${index.change_pct}%
                    </div>
                </div>
            `;
            container.innerHTML += cardHTML;
        });
    }

    function updateAssetPrices(assets) {
        assets.forEach(asset => {
            const priceEl = document.getElementById('price-' + asset.ticker);
            const changeEl = document.getElementById('change-' + asset.ticker);
            
            if (priceEl && changeEl) {
                priceEl.innerText = asset.price;
                
                const sign = asset.is_positive ? '+' : '';
                changeEl.innerText = `${sign}${asset.change_pct}%`;
                changeEl.className = asset.is_positive ? 'trend-up' : 'trend-down';
            }
        });
    }

    function handlePulseError() {
        {% if show_indexes %}
        const pulseDot = document.getElementById('pulse-dot');
        if (pulseDot) {
            pulseDot.classList.add('offline');
            document.getElementById('pulse-text').innerText = "Market Pulse Offline (Retrying...)";
        }
        {% endif %}
    }

    function startPulseEngine() {
        fetchMarketPulse();
        marketPulseInterval = setInterval(fetchMarketPulse, REFRESH_RATE_MS);
    }

    function stopPulseEngine() {
        clearInterval(marketPulseInterval);
        {% if show_indexes %}
        const pulseDot = document.getElementById('pulse-dot');
        if (pulseDot) {
            pulseDot.classList.add('offline');
            document.getElementById('pulse-text').innerText = "Market Pulse Paused (Tab Inactive)";
        }
        {% endif %}
    }

    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            stopPulseEngine();
        } else {
            startPulseEngine();
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        if (!document.hidden) {
            startPulseEngine();
        }
    });
</script>
