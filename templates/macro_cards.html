<style>
    .macro-container {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-bottom: 25px;
    }
    
    .macro-card {
        flex: 1;
        min-width: 140px;
        background-color: #1e1e1e;
        border-radius: 8px;
        padding: 15px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        border-top: 3px solid #444; /* Default border */
        transition: border-color 0.3s ease, background-color 0.3s ease;
    }

    .macro-card.positive {
        border-top-color: #00ffcc;
        background: linear-gradient(180deg, rgba(0, 255, 204, 0.05) 0%, rgba(30, 30, 30, 1) 100%);
    }

    .macro-card.negative {
        border-top-color: #ff4d4d;
        background: linear-gradient(180deg, rgba(255, 77, 77, 0.05) 0%, rgba(30, 30, 30, 1) 100%);
    }

    .macro-title {
        font-size: 13px;
        color: #aaa;
        font-weight: bold;
        text-transform: uppercase;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
    }

    .macro-price {
        font-size: 18px;
        font-weight: bold;
        color: #fff;
        margin-bottom: 5px;
    }

    .macro-change {
        font-size: 13px;
        font-weight: bold;
    }

    .macro-change.positive {
        color: #00ffcc;
    }

    .macro-change.negative {
        color: #ff4d4d;
    }

    .macro-pulse-indicator {
        font-size: 10px;
        color: #555;
        margin-bottom: 10px;
        text-align: right;
    }
    
    .pulse-dot {
        height: 8px;
        width: 8px;
        background-color: #00ffcc;
        border-radius: 50%;
        display: inline-block;
        margin-right: 5px;
        box-shadow: 0 0 5px #00ffcc;
    }
    
    .pulse-dot.offline {
        background-color: #ff4d4d;
        box-shadow: 0 0 5px #ff4d4d;
    }
</style>

<div id="macro-status" class="macro-pulse-indicator">
    <span id="pulse-dot" class="pulse-dot"></span> <span id="pulse-text">Live Market Pulse Active</span>
</div>
<div id="macro-cards-container" class="macro-container">
    </div>

<script>
    let marketPulseInterval;
    const REFRESH_RATE_MS = 60000; // 60 Seconds

    async function fetchMarketPulse() {
        try {
            // Determine if we need to fetch live asset prices alongside indices
            let requestedTickers = [];
            if (window.ENABLE_LIVE_ASSETS) {
                const rows = document.querySelectorAll('.live-asset-row');
                rows.forEach(row => {
                    const ticker = row.getAttribute('data-ticker');
                    if (ticker) requestedTickers.push(ticker);
                });
            }

            // Post request to backend engine
            const response = await fetch('/api/market-pulse', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ tickers: requestedTickers })
            });
            
            const result = await response.json();
            
            if (response.ok && result.status === 'success') {
                const indexes = result.data.indexes || [];
                const assets = result.data.assets || [];
                
                renderMacroCards(indexes);
                updateAssetPrices(assets);
                
                document.getElementById('pulse-dot').classList.remove('offline');
                document.getElementById('pulse-text').innerText = "Live Market Pulse Active";
            } else {
                handlePulseError();
            }
        } catch (error) {
            handlePulseError();
        }
    }

    function renderMacroCards(data) {
        const container = document.getElementById('macro-cards-container');
        container.innerHTML = ''; 
        
        data.forEach(index => {
            const isPos = index.is_positive;
            const cardClass = isPos ? 'positive' : 'negative';
            const changeClass = isPos ? 'positive' : 'negative';
            const sign = isPos ? '+' : '';
            
            const cardHTML = `
                <div class="macro-card ${cardClass}">
                    <div class="macro-title">${index.name}</div>
                    <div class="macro-price">${index.price}</div>
                    <div class="macro-change ${changeClass}">
                        ${sign}${index.change_pts} (${sign}${index.change_pct}%)
                    </div>
                </div>
            `;
            container.innerHTML += cardHTML;
        });
    }

    function updateAssetPrices(assets) {
        // Find DOM table cells and dynamically overwrite static SQLite data with Live Ticks
        assets.forEach(asset => {
            const priceEl = document.getElementById('price-' + asset.ticker);
            const changeEl = document.getElementById('change-' + asset.ticker);
            
            if (priceEl && changeEl) {
                priceEl.innerText = asset.price;
                
                const sign = asset.is_positive ? '+' : '';
                changeEl.innerText = `${sign}${asset.change_pts} (${sign}${asset.change_pct}%)`;
                changeEl.className = asset.is_positive ? 'trend-up' : 'trend-down';
            }
        });
    }

    function handlePulseError() {
        document.getElementById('pulse-dot').classList.add('offline');
        document.getElementById('pulse-text').innerText = "Market Pulse Offline (Retrying...)";
    }

    function startPulseEngine() {
        fetchMarketPulse();
        marketPulseInterval = setInterval(fetchMarketPulse, REFRESH_RATE_MS);
    }

    function stopPulseEngine() {
        clearInterval(marketPulseInterval);
        document.getElementById('pulse-dot').classList.add('offline');
        document.getElementById('pulse-text').innerText = "Market Pulse Paused (Tab Inactive)";
    }

    // --- Page Visibility API Integration ---
    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            stopPulseEngine();
        } else {
            startPulseEngine();
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        if (!document.hidden) {
            startPulseEngine();
        }
    });
</script>
