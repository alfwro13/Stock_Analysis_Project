<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Quantamental - Reset Password</title>
    <link rel="stylesheet" href="/static/css/styles.css?v={{ css_version }}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            background: var(--card-bg, #1e1e2e);
            border-radius: 14px;
            border: 1px solid var(--border-color, #333);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .login-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.75rem;
        }
        .login-logo img { width: 36px; height: 36px; }
        .login-logo span { font-size: 1.2rem; font-weight: 600; letter-spacing: 0.01em; }
        .login-field { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
        .login-field label { font-size: 0.82rem; color: var(--text-muted, #aaa); }
        .login-field input {
            padding: 0.6rem 0.8rem;
            border-radius: 7px;
            border: 1px solid var(--border-color, #444);
            background: var(--input-bg, #111);
            color: inherit;
            font-size: 0.97rem;
            transition: border-color 0.15s;
        }
        .login-field input:focus { outline: none; border-color: #4f8ef7; }
        .login-btn {
            width: 100%;
            padding: 0.7rem;
            border-radius: 7px;
            border: none;
            background: #4f8ef7;
            color: #fff;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 0.5rem;
        }
        .login-btn:hover { background: #3a75d4; }
        .login-btn:disabled { background: #2a4a7f; cursor: not-allowed; }
        .login-msg {
            margin-top: 1rem;
            padding: 0.55rem 0.8rem;
            border-radius: 6px;
            font-size: 0.88rem;
            display: none;
        }
        .login-msg.error { background: #3d1a1a; color: #f87171; }
        .login-msg.success { background: #1a3d1a; color: #4ade80; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.87rem;
            color: var(--text-muted, #aaa);
            text-decoration: none;
        }
        .back-link:hover { color: #4f8ef7; }
        .page-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.3rem; }
        .page-desc { font-size: 0.87rem; color: var(--text-muted, #aaa); margin-bottom: 1.4rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <img src="/assets/logo_small.png" alt="Logo">
            <span>Quantamental</span>
        </div>

        {% if token %}
        <p class="page-title">Set New Password</p>
        <p class="page-desc">Enter and confirm your new password below.</p>
        <form id="resetForm">
            <input type="hidden" id="token" value="{{ token }}">
            <div class="login-field">
                <label for="new_password">New password</label>
                <input type="password" id="new_password" autocomplete="new-password" required>
            </div>
            <div class="login-field">
                <label for="confirm_password">Confirm new password</label>
                <input type="password" id="confirm_password" autocomplete="new-password" required>
            </div>
            <button type="submit" class="login-btn" id="resetBtn">Set Password</button>
        </form>
        {% else %}
        <p class="page-title">Reset Password</p>
        <p class="page-desc">Enter your account email address. If it matches the registered address, a reset link will be sent.</p>
        <form id="requestForm">
            <div class="login-field">
                <label for="email">Account email</label>
                <input type="email" id="email" autocomplete="email" autofocus required>
            </div>
            <button type="submit" class="login-btn" id="requestBtn">Send Reset Link</button>
        </form>
        {% endif %}

        <div id="msg" class="login-msg"></div>
        <a href="/login" class="back-link">← Back to login</a>
    </div>

    <script>
        const msg = document.getElementById('msg');

        function showMsg(text, isError) {
            msg.textContent = text;
            msg.className = 'login-msg ' + (isError ? 'error' : 'success');
            msg.style.display = 'block';
        }

        {% if token %}
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('resetBtn');
            btn.disabled = true;
            btn.textContent = 'Saving…';
            const res = await fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    token: document.getElementById('token').value,
                    new_password: document.getElementById('new_password').value,
                    confirm_password: document.getElementById('confirm_password').value,
                }),
            });
            const data = await res.json().catch(() => ({}));
            if (res.ok) {
                showMsg('Password updated. Redirecting to login…', false);
                setTimeout(() => { window.location.href = '/login'; }, 1800);
            } else {
                showMsg(data.detail || 'Failed to reset password.', true);
                btn.disabled = false;
                btn.textContent = 'Set Password';
            }
        });
        {% else %}
        document.getElementById('requestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('requestBtn');
            btn.disabled = true;
            btn.textContent = 'Sending…';
            const res = await fetch('/api/request-password-reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: document.getElementById('email').value }),
            });
            const data = await res.json().catch(() => ({}));
            showMsg(data.message || 'Request submitted.', !res.ok);
            btn.disabled = false;
            btn.textContent = 'Send Reset Link';
        });
        {% endif %}
    </script>
</body>
</html>
