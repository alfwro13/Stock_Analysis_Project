{% macro secret_field(id, label, is_set, placeholder="", wrapper_class="") %}
<div class="{{ wrapper_class }}">
    <div class="form-group mb-10">
        <label for="{{ id }}">{{ label | safe }}</label>
        <input type="password" id="{{ id }}" class="form-control" autocomplete="new-password" data-secret-set="{{ 1 if is_set else 0 }}" data-empty-placeholder="{{ placeholder }}" placeholder="{{ 'Stored — leave blank to keep' if is_set else placeholder }}">
        <span id="{{ id }}_state" class="settings-desc-sm mt-5 {{ 'text-success' if is_set else 'text-warning' }}">{{ 'Stored on the server and never shown again. Type a new value to replace it.' if is_set else 'Not set.' }}</span>
    </div>
    <div id="{{ id }}_clear_row" class="checkbox-group{% if not is_set %} d-none{% endif %}">
        <input type="checkbox" id="{{ id }}_clear">
        <label for="{{ id }}_clear">Clear the stored value on save</label>
    </div>
</div>
{% endmacro %}
