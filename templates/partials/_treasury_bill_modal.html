<div class="modal fade" id="treasuryBillModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Buy UK Treasury Bill</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="tbill-account-id">
        <div class="form-group">
            <label for="tbill-purchase-date">Start Date</label>
            <input type="date" id="tbill-purchase-date" onchange="_onTBillInputChange()">
        </div>
        <div class="form-group">
            <label for="tbill-purchase-price"><abbr title="What Freetrade actually debited you — shown as Amount / Total Cost in the app.">Amount (Total Cost)</abbr> ({{ account.currency }})</label>
            <input type="number" id="tbill-purchase-price" step="0.01" oninput="_onTBillInputChange()">
        </div>
        <div class="form-group">
            <label for="tbill-ytm"><abbr title="The yield shown in the app at the time you bought — only an estimate, since the real yield for your bill isn't fixed until the Friday DMO tender closes.">Indicative YTM (%)</abbr></label>
            <input type="number" id="tbill-ytm" step="0.01" oninput="_onTBillInputChange()">
        </div>
        <div class="form-group">
            <label for="tbill-maturity-date">Maturity Date</label>
            <input type="date" id="tbill-maturity-date" onchange="_onTBillInputChange()">
        </div>
        <div class="form-group">
            <label for="tbill-face-value"><abbr title="Estimated from Amount + Indicative YTM, since Freetrade never states this directly — auto-filled but editable if you later learn the exact redemption amount. This is exactly what gets credited to cash when the bill matures.">Face Value (estimated)</abbr> ({{ account.currency }})</label>
            <input type="number" id="tbill-face-value" step="0.01" oninput="_updateTBillPreview()">
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="tbill-auto-reinvest">
            <label class="form-check-label" for="tbill-auto-reinvest">
                <abbr title="The app can never auto-purchase a replacement bill — the actual yield isn't known until the Friday DMO tender. This only sends a reminder when the bill matures.">Auto-Reinvest (reminder only)</abbr>
            </label>
        </div>
        <div class="form-group">
            <label for="tbill-notes">Notes</label>
            <input type="text" id="tbill-notes">
        </div>
        <div id="tbill-preview" class="status-msg-sm text-accent-cyan mb-2"></div>
        <div id="tbill-status" class="status-msg-sm"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-save" onclick="submitBuyTreasuryBill()">Save</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="editTreasuryBillModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Treasury Bill</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="tbill-edit-account-id">
        <input type="hidden" id="tbill-edit-bill-id">
        <input type="hidden" id="tbill-edit-purchase-price">
        <input type="hidden" id="tbill-edit-purchase-date">
        <input type="hidden" id="tbill-edit-maturity-date">
        <p class="text-muted small">Use this to correct the Face Value once you know the real redemption figure — if this bill has already matured, its posted cash credit is corrected to match.</p>
        <div class="form-group">
            <label for="tbill-edit-ytm"><abbr title="Optional — enter this instead of Face Value directly to have it recomputed from the amount paid and the number of days held.">Confirmed YTM (%)</abbr></label>
            <input type="number" id="tbill-edit-ytm" step="0.01" oninput="_updateEditTBillPreview()">
        </div>
        <div class="form-group">
            <label for="tbill-edit-face-value">Face Value ({{ account.currency }})</label>
            <input type="number" id="tbill-edit-face-value" step="0.01" oninput="_updateEditTBillPreview()">
        </div>
        <div id="tbill-edit-preview" class="status-msg-sm text-accent-cyan mb-2"></div>
        <div id="tbill-edit-status" class="status-msg-sm"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-save" onclick="submitEditTreasuryBill()">Save</button>
      </div>
    </div>
  </div>
</div>
