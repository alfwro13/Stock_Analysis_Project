<div class="modal fade" id="txnModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="txnModalTitle">Add Transaction</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="txn-id">
        <input type="hidden" id="txn-account-id">
        <input type="hidden" id="txn-company-name">
        <div class="form-group">
            <label for="txn-account">Account</label>
            <select id="txn-account" onchange="_populateToAccountSelect()"></select>
        </div>
        <div class="form-group">
            <label for="txn-type">Type</label>
            <select id="txn-type" onchange="_updateTxnFieldsForType()">
                <option value="Buy">Buy</option>
                <option value="Sell">Sell</option>
                <option value="Dividend">Dividend</option>
                <option value="Interest">Interest</option>
                <option value="Fee">Fee</option>
                <option value="Cash">Cash</option>
                <option value="Transfer">Transfer</option>
            </select>
        </div>
        <div class="form-group d-none" id="txn-to-account-group">
            <label for="txn-to-account">To Account</label>
            <select id="txn-to-account"></select>
        </div>
        <div class="flex-gap-15" id="txn-ticker-group">
            <div class="form-group flex-2">
                <label for="txn-ticker">Ticker</label>
                <input type="text" id="txn-ticker" placeholder="AAPL" autocomplete="off">
                <div id="txn-ticker-result" class="status-msg-sm"></div>
            </div>
            <div class="form-group">
                <label for="txn-isin"><abbr title="International Securities Identification Number — optional, identifies the instrument independent of ticker symbol changes.">ISIN</abbr></label>
                <input type="text" id="txn-isin" placeholder="Optional" autocomplete="off">
            </div>
        </div>
        <div class="form-group">
            <label for="txn-date">Date</label>
            <input type="date" id="txn-date" onchange="_onTxnCurrencyOrDateChange()">
        </div>
        <div class="form-group" id="txn-quantity-group">
            <label for="txn-quantity">Quantity</label>
            <input type="number" id="txn-quantity" step="0.000001" oninput="_updateTxnTotalPreview()">
        </div>
        <div class="flex-gap-15">
            <div class="form-group flex-2">
                <label for="txn-price"><abbr id="txn-price-abbr" title="Per-share price in the transaction's native trade currency.">Unit Price</abbr></label>
                <input type="number" id="txn-price" step="0.0001" oninput="_updateTxnTotalPreview()">
                <div id="txn-price-hint" class="text-muted small d-none">Positive amount = deposit. Negative amount = withdrawal.</div>
            </div>
            <div class="form-group" id="txn-currency-group">
                <label for="txn-currency"><abbr title="The currency this transaction is denominated in. GBp is London Stock Exchange pence — distinct from GBP. Auto-filled from the ticker lookup, but always editable.">Currency</abbr></label>
                <select id="txn-currency" onchange="_onTxnCurrencyOrDateChange()"></select>
            </div>
        </div>
        <div class="flex-gap-15">
            <div class="form-group flex-2">
                <label for="txn-fee">Fee</label>
                <input type="number" id="txn-fee" step="0.01" value="0" oninput="_updateTxnTotalPreview()">
            </div>
            <div class="form-group" id="txn-fee-currency-group">
                <label for="txn-fee-currency"><abbr title="The currency the fee itself is billed in — independent of the trade currency (e.g. a broker's FX fee shown in your base currency on a foreign-currency trade).">Fee Currency</abbr></label>
                <select id="txn-fee-currency" onchange="_onFeeCurrencyOrDateChange()"></select>
            </div>
        </div>
        <div class="flex-gap-15">
            <div class="form-group" id="txn-fx-group">
                <label for="txn-fx"><abbr title="Multiplier that converts the trade currency to your base currency. Auto-filled from the historical FX rate on the transaction date — still editable.">Exchange Rate</abbr></label>
                <input type="number" id="txn-fx" step="0.000001" placeholder="auto" oninput="_updateTxnTotalPreview()">
            </div>
            <div class="form-group" id="txn-fee-fx-group">
                <label for="txn-fee-fx"><abbr title="Multiplier that converts the fee currency to your base currency. Auto-filled from the historical FX rate on the transaction date — still editable.">Fee Exchange Rate</abbr></label>
                <input type="number" id="txn-fee-fx" step="0.000001" placeholder="auto" oninput="_updateTxnTotalPreview()">
            </div>
        </div>
        <div class="form-group">
            <label for="txn-notes">Notes</label>
            <input type="text" id="txn-notes" placeholder="Optional">
        </div>
        <div id="txn-total-preview" class="status-msg-sm text-accent-cyan mb-2"></div>
        <div id="txn-status" class="status-msg-sm"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-save" onclick="submitTransaction()">Save</button>
      </div>
    </div>
  </div>
</div>
