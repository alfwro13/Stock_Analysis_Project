<div class="modal fade" id="benchmarkModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="benchmarkModalTitle">Pension Benchmarks</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="benchmark-account-id">

        <div class="form-group">
            <label for="benchmark-cpi-target"><abbr title="The Pension Value chart overlays a UK CPI YoY + this target growth line, rebased to the pension's starting value.">UK CPI + Target (%)</abbr></label>
            <input type="number" id="benchmark-cpi-target" step="0.1" value="4.0">
        </div>

        <h6 class="mt-3">Ticker Benchmarks</h6>
        <div id="benchmark-ticker-rows"></div>
        <button type="button" class="btn-test mt-8" onclick="addBenchmarkTickerRow()">+ Add Ticker</button>
        <div id="benchmark-config-status" class="status-msg-sm"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-save" onclick="saveBenchmarkConfig()">Save</button>
      </div>
    </div>
  </div>
</div>
