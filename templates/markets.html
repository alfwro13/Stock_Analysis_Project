{% extends "base.html" %}

{% block title %}Quantamental - Markets{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center mb-1 gap-2">
    <h1 class="mb-0">Markets</h1>
    <div class="d-flex flex-wrap align-items-center gap-3">
        <div class="btn-group change-period-group" id="marketsViewGroup" role="group" aria-label="Markets view">
            <button type="button" class="btn btn-sm change-period-btn" data-view="dynamic">🌅 Dynamic</button>
            <button type="button" class="btn btn-sm change-period-btn" data-view="static">📌 Static</button>
        </div>
        <div id="markets-status" class="live-refresh-status">
            <span id="markets-pulse-dot" class="pulse-dot"></span>
            <span id="markets-pulse-text">Loading market data…</span>
            <span id="markets-last-updated"></span>
        </div>
        <a href="/market-screener" class="btn btn-outline-secondary btn-sm">🌐 Market Screener</a>
        <a href="/market-reports" class="btn btn-outline-secondary btn-sm">📈 Market Reports</a>
    </div>
</div>
<p class="text-secondary mb-3">Global indexes, commodities, and FX — ordered by which regional session is most relevant right now.</p>

<div id="markets-regions-container"></div>

<script>
window.MARKETS_DEFAULT_VIEW = {{ default_view | tojson }};
window.MARKETS_HIDE_US_FUTURES = {{ hide_us_futures | tojson }};
window.REFRESH_RATE_MS = {{ config.UI_PREFERENCES.REFRESH_RATE | default(60) }} * 1000;
</script>
<script src="/static/js/markets.js?v={{ css_version }}"></script>
{% endblock %}
