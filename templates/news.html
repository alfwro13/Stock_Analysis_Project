<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <title>Quantamental - News Feed</title>
    <link rel="stylesheet" href="/static/css/styles.css?v={{ css_version }}">
</head>
<body class="body-watchlist">

    <div class="header-container">
        <div>
            <div class="title-wrapper">
                <a href="https://github.com/alfwro13/Stock_Analysis_Project" target="_blank" class="logo-link">
                    <img src="/assets/logo_small.png" alt="Quantamental Logo" class="logo-img">
                </a>
                <h1>📰 News Feed</h1>
            </div>
            {% set active_page = 'news' %}
            {% include 'navbar.html' %}
        </div>
    </div>

    <div class="controls-container" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div class="btn-group" id="sourceFilterGroup">
            <button class="btn-filter active" data-source="all" onclick="setSource('all')">All</button>
            <button class="btn-filter" data-source="portfolio" onclick="setSource('portfolio')">Portfolio</button>
            <button class="btn-filter" data-source="watchlist" onclick="setSource('watchlist')">Watchlist</button>
        </div>
        <input type="text" id="newsSearchInput" class="filter-input" placeholder="🔍 Search headlines..."
               style="flex:1;min-width:200px;" oninput="filterArticles()">
        <button class="btn-test btn-cyan" id="fetchNowBtn" onclick="fetchNow()" style="margin:0;">
            ▶ Fetch Now
        </button>
        <span id="lastUpdated" style="color:var(--text-muted,#888);font-size:0.82em;"></span>
    </div>

    <div id="newsLayout" style="display:flex;gap:0;height:calc(100vh - 160px);overflow:hidden;">

        <!-- LEFT: Article List -->
        <div id="articleList"
             style="width:36%;min-width:260px;overflow-y:auto;border-right:1px solid var(--border-color,#2a2a2a);padding:6px 0;">
            <div id="articleListInner"></div>
            <div id="noArticles" style="display:none;padding:40px 20px;text-align:center;color:var(--text-muted,#888);">
                <p style="font-size:1.1em;">No articles yet.</p>
                <p style="font-size:0.85em;">Click <strong>Fetch Now</strong> or wait for the next scheduled run.</p>
            </div>
        </div>

        <!-- RIGHT: Article Reader -->
        <div id="articleReader"
             style="flex:1;overflow-y:auto;padding:24px 28px;display:flex;align-items:center;justify-content:center;">
            <div id="readerPlaceholder" style="text-align:center;color:var(--text-muted,#888);">
                <p style="font-size:1.3em;">← Select an article to read</p>
            </div>
            <div id="readerContent" style="display:none;max-width:820px;width:100%;"></div>
        </div>

    </div>

    <style>
        .btn-filter {
            background: var(--card-bg, #1a1a1a);
            border: 1px solid var(--border-color, #333);
            color: var(--text-primary, #e0e0e0);
            padding: 5px 14px;
            cursor: pointer;
            font-size: 0.85em;
            transition: background 0.15s;
        }
        .btn-filter:first-child { border-radius: 4px 0 0 4px; }
        .btn-filter:last-child  { border-radius: 0 4px 4px 0; }
        .btn-filter:not(:first-child) { border-left: none; }
        .btn-filter.active, .btn-filter:hover {
            background: #00b4d8;
            border-color: #00b4d8;
            color: #000;
        }

        .article-item {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color, #222);
            cursor: pointer;
            transition: background 0.12s;
        }
        .article-item:hover { background: rgba(255,255,255,0.04); }
        .article-item.selected { background: rgba(0,180,216,0.12); border-left: 3px solid #00b4d8; }
        .article-item .art-headline {
            font-size: 0.88em;
            font-weight: 500;
            line-height: 1.35;
            color: var(--text-primary, #e0e0e0);
            margin-bottom: 4px;
        }
        .article-item .art-meta {
            font-size: 0.75em;
            color: var(--text-muted, #888);
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .art-ticker-badge {
            background: rgba(0,180,216,0.2);
            color: #00b4d8;
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 0.8em;
            font-weight: 600;
        }
        .art-source-badge {
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 0.78em;
        }
        .art-source-portfolio { background: rgba(78,201,87,0.2); color: #4ec957; }
        .art-source-watchlist  { background: rgba(255,193,7,0.15); color: #ffc107; }
        .art-source-both       { background: rgba(138,43,226,0.2); color: #bf7fff; }

        /* Reader panel */
        #readerContent h2 {
            font-size: 1.2em;
            line-height: 1.4;
            margin-bottom: 10px;
            color: var(--text-primary, #e0e0e0);
        }
        #readerContent .reader-meta {
            font-size: 0.8em;
            color: var(--text-muted, #888);
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        #readerContent .reader-body {
            font-size: 0.92em;
            line-height: 1.7;
            color: var(--text-primary, #ccc);
            white-space: pre-wrap;
            word-break: break-word;
        }
        #readerContent .reader-body.summary-fallback {
            color: #aaa;
            font-style: italic;
        }
        #readerContent .open-link {
            display: inline-block;
            margin-top: 18px;
            padding: 6px 16px;
            background: #00b4d8;
            color: #000;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85em;
            font-weight: 600;
        }
        #readerContent .open-link:hover { background: #0090b0; }

        @media (max-width: 700px) {
            #newsLayout { flex-direction: column; height: auto; }
            #articleList { width: 100%; border-right: none; border-bottom: 1px solid var(--border-color, #222); max-height: 40vh; }
        }
    </style>

    <script>
        let allArticles = [];
        let currentSource = 'all';
        let selectedId = null;

        function relTime(ts) {
            const diff = Math.floor(Date.now() / 1000) - ts;
            if (diff < 60)   return `${diff}s ago`;
            if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
            return `${Math.floor(diff/86400)}d ago`;
        }

        function sourceBadge(src) {
            const map = {portfolio: 'portfolio', watchlist: 'watchlist', both: 'both'};
            const label = {portfolio: 'Portfolio', watchlist: 'Watchlist', both: 'Both'};
            const cls = map[src] || '';
            return `<span class="art-source-badge art-source-${cls}">${label[src] || src}</span>`;
        }

        function renderList(articles) {
            const container = document.getElementById('articleListInner');
            const empty = document.getElementById('noArticles');
            if (!articles.length) {
                container.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';
            container.innerHTML = articles.map(a => `
                <div class="article-item${a.id === selectedId ? ' selected' : ''}"
                     id="art-${a.id}" onclick="selectArticle(${a.id})">
                    <div class="art-headline">${escHtml(a.headline)}</div>
                    <div class="art-meta">
                        <span class="art-ticker-badge">${escHtml(a.ticker)}</span>
                        ${sourceBadge(a.source_list)}
                        <span>${escHtml(a.publisher || '')}</span>
                        <span>${relTime(a.published_at)}</span>
                    </div>
                </div>
            `).join('');
        }

        function escHtml(s) {
            if (!s) return '';
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function filterArticles() {
            const q = document.getElementById('newsSearchInput').value.toLowerCase();
            const filtered = allArticles.filter(a => {
                const matchSrc = currentSource === 'all' || a.source_list === currentSource || a.source_list === 'both';
                const matchQ = !q || a.headline.toLowerCase().includes(q)
                    || (a.ticker || '').toLowerCase().includes(q)
                    || (a.company_name || '').toLowerCase().includes(q)
                    || (a.publisher || '').toLowerCase().includes(q);
                return matchSrc && matchQ;
            });
            renderList(filtered);
        }

        function setSource(src) {
            currentSource = src;
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.toggle('active', b.dataset.source === src));
            filterArticles();
        }

        function selectArticle(id) {
            selectedId = id;
            const a = allArticles.find(x => x.id === id);
            if (!a) return;

            // Highlight selected
            document.querySelectorAll('.article-item').forEach(el => el.classList.remove('selected'));
            const el = document.getElementById('art-' + id);
            if (el) el.classList.add('selected');

            document.getElementById('readerPlaceholder').style.display = 'none';
            const reader = document.getElementById('readerContent');
            reader.style.display = 'block';

            const pubDate = new Date(a.published_at * 1000).toLocaleString();
            const bodyHtml = a.body_fetched && a.full_text
                ? `<div class="reader-body">${escHtml(a.full_text)}</div>`
                : `<div class="reader-body summary-fallback">${escHtml(a.summary || 'No summary available.')}<br><em style="font-size:0.85em;color:#666;">(Full text not available — open original for complete article)</em></div>`;

            reader.innerHTML = `
                <h2>${escHtml(a.headline)}</h2>
                <div class="reader-meta">
                    <span class="art-ticker-badge">${escHtml(a.ticker)}${a.company_name ? ' · ' + escHtml(a.company_name) : ''}</span>
                    ${sourceBadge(a.source_list)}
                    <span>${escHtml(a.publisher || '')}</span>
                    <span>${pubDate}</span>
                </div>
                ${bodyHtml}
                ${a.url ? `<a href="${escHtml(a.url)}" target="_blank" rel="noopener" class="open-link">Open original ↗</a>` : ''}
            `;
        }

        async function loadArticles() {
            try {
                const resp = await fetch('/api/news-feed?source=all&limit=200');
                const data = await resp.json();
                allArticles = data.articles || [];
                const updated = document.getElementById('lastUpdated');
                updated.textContent = `${allArticles.length} articles loaded · ${new Date().toLocaleTimeString()}`;
                filterArticles();
            } catch (e) {
                console.error('Failed to load news feed:', e);
            }
        }

        async function fetchNow() {
            const btn = document.getElementById('fetchNowBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Fetching...';
            try {
                const resp = await fetch('/api/news-feed/run-now', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', ...getCsrfHeaders()},
                });
                const data = await resp.json();
                btn.textContent = '✓ Queued';
                setTimeout(() => {
                    btn.textContent = '▶ Fetch Now';
                    btn.disabled = false;
                    loadArticles();
                }, 3000);
            } catch (e) {
                btn.textContent = '✗ Error';
                setTimeout(() => { btn.textContent = '▶ Fetch Now'; btn.disabled = false; }, 3000);
            }
        }

        function getCsrfHeaders() {
            const meta = document.querySelector('meta[name="csrf-token"]');
            return meta ? {'X-CSRF-Token': meta.content} : {};
        }

        document.addEventListener('DOMContentLoaded', loadArticles);
    </script>

    <script src="/static/js/csrf.js"></script>
</body>
</html>
