<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <title>Quantamental - News Feed</title>
    <link rel="stylesheet" href="/static/css/styles.css?v={{ css_version }}">
    <style>
        /* Lock the page — no body-level scroll on this screen */
        html, body { height: 100%; overflow: hidden; margin: 0; padding: 0; }

        /* Full-viewport column shell */
        #newsPageShell {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header shrinks to fit */
        #newsHeader { flex-shrink: 0; }

        /* Controls bar */
        #newsControls {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-color, #2a2a2a);
        }

        /* Two-panel area — takes all remaining space */
        #newsLayout {
            flex: 1;
            min-height: 0;          /* critical: lets flex child shrink below content size */
            display: flex;
            overflow: hidden;
        }

        /* LEFT panel */
        #articleList {
            width: 36%;
            min-width: 240px;
            overflow-y: auto;
            overflow-x: hidden;
            border-right: 1px solid var(--border-color, #2a2a2a);
        }

        /* RIGHT panel — plain block, no flex centering so top is never clipped */
        #articleReader {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 24px 28px;
        }

        /* Placeholder centred via padding, not flex */
        #readerPlaceholder {
            text-align: center;
            padding-top: 25%;
            color: var(--text-muted, #888);
        }

        /* Filter buttons */
        .btn-filter {
            background: var(--card-bg, #1a1a1a);
            border: 1px solid var(--border-color, #333);
            color: var(--text-primary, #e0e0e0);
            padding: 5px 14px;
            cursor: pointer;
            font-size: 0.85em;
            transition: background 0.15s;
        }
        .btn-filter:first-child { border-radius: 4px 0 0 4px; }
        .btn-filter:last-child  { border-radius: 0 4px 4px 0; }
        .btn-filter:not(:first-child) { border-left: none; }
        .btn-filter.active, .btn-filter:hover {
            background: #00b4d8;
            border-color: #00b4d8;
            color: #000;
        }

        /* Search wrapper with inline ✕ */
        .search-wrap {
            position: relative;
            flex: 1;
            min-width: 200px;
        }
        .search-wrap input {
            width: 100%;
            box-sizing: border-box;
            padding-right: 28px;
        }
        .search-clear {
            display: none;
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 1em;
            line-height: 1;
            padding: 0;
        }
        .search-clear:hover { color: #ccc; }

        /* Article list items */
        .article-item {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color, #222);
            cursor: pointer;
            transition: background 0.12s;
        }
        .article-item:hover { background: rgba(255,255,255,0.04); }
        .article-item.selected {
            background: rgba(0,180,216,0.12);
            border-left: 3px solid #00b4d8;
            padding-left: 11px;
        }
        .art-headline {
            font-size: 0.88em;
            font-weight: 500;
            line-height: 1.35;
            color: var(--text-primary, #e0e0e0);
            margin-bottom: 4px;
        }
        .art-meta {
            font-size: 0.75em;
            color: var(--text-muted, #888);
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .art-ticker-badge {
            background: rgba(0,180,216,0.2);
            color: #00b4d8;
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 0.8em;
            font-weight: 600;
        }
        .art-source-badge {
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 0.78em;
        }
        .art-source-portfolio { background: rgba(78,201,87,0.2);   color: #4ec957; }
        .art-source-watchlist  { background: rgba(255,193,7,0.15);  color: #ffc107; }
        .art-source-both       { background: rgba(138,43,226,0.2);  color: #bf7fff; }

        .sent-badge {
            border-radius: 3px;
            padding: 1px 6px;
            font-size: 0.78em;
            font-weight: 600;
        }
        .sent-positive { background: rgba(78,201,87,0.2);  color: #4ec957; }
        .sent-neutral  { background: rgba(150,150,150,0.15); color: #999; }
        .sent-negative { background: rgba(255,77,77,0.2);  color: #ff6b6b; }

        /* Reader content */
        #readerContent {
            max-width: 820px;
        }
        #readerContent h2 {
            font-size: 1.2em;
            line-height: 1.4;
            margin: 0 0 10px 0;
            color: var(--text-primary, #e0e0e0);
        }
        .reader-meta {
            font-size: 0.8em;
            color: var(--text-muted, #888);
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .reader-body {
            font-size: 0.92em;
            line-height: 1.7;
            color: #ccc;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .reader-body.summary-fallback {
            color: #aaa;
            font-style: italic;
        }
        .reader-headline-link {
            color: inherit;
            text-decoration: none;
        }
        .reader-headline-link:hover {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        #noArticles {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted, #888);
        }

        @media (max-width: 700px) {
            html, body { overflow: auto; }
            #newsPageShell { height: auto; }
            #newsLayout { flex-direction: column; overflow: visible; }
            #articleList { width: 100%; border-right: none; border-bottom: 1px solid var(--border-color, #222); max-height: 45vh; overflow-y: auto; }
            #articleReader { overflow-y: visible; padding: 16px; }
        }
    </style>
</head>
<body class="body-watchlist">

<div id="newsPageShell">

    <!-- HEADER -->
    <div id="newsHeader" class="header-container">
        <div>
            <div class="title-wrapper">
                <a href="https://github.com/alfwro13/Stock_Analysis_Project" target="_blank" class="logo-link">
                    <img src="/assets/logo_small.png" alt="Quantamental Logo" class="logo-img">
                </a>
                <h1>📰 News Feed</h1>
            </div>
            {% set active_page = 'news' %}
            {% include 'navbar.html' %}
        </div>
    </div>

    <!-- CONTROLS -->
    <div id="newsControls">
        <div class="btn-group">
            <button class="btn-filter active" data-source="all"       onclick="setSource('all')">All</button>
            <button class="btn-filter"        data-source="portfolio" onclick="setSource('portfolio')">Portfolio</button>
            <button class="btn-filter"        data-source="watchlist" onclick="setSource('watchlist')">Watchlist</button>
        </div>

        <div class="search-wrap">
            <input type="text" id="newsSearchInput" class="filter-input"
                   placeholder="🔍 Search headlines..." oninput="onSearch()">
            <button id="searchClearBtn" class="search-clear" onclick="clearSearch()" title="Clear search">✕</button>
        </div>

        <button class="btn-test btn-cyan" id="fetchNowBtn" onclick="fetchNow()" style="margin:0;">
            ▶ Fetch Now
        </button>
        <span id="lastUpdated" style="color:var(--text-muted,#888);font-size:0.82em;"></span>
    </div>

    <!-- TWO-PANEL READER -->
    <div id="newsLayout">

        <!-- LEFT: Article list -->
        <div id="articleList">
            <div id="articleListInner"></div>
            <div id="noArticles" style="display:none;">
                <p style="font-size:1.1em;">No articles yet.</p>
                <p style="font-size:0.85em;">Click <strong>Fetch Now</strong> or wait for the next scheduled run.</p>
            </div>
        </div>

        <!-- RIGHT: Reader -->
        <div id="articleReader">
            <div id="readerPlaceholder">
                <p style="font-size:1.3em;">← Select an article to read</p>
            </div>
            <div id="readerContent" style="display:none;"></div>
        </div>

    </div><!-- #newsLayout -->

</div><!-- #newsPageShell -->

<script>
    let allArticles = [];
    let currentSource = 'all';
    let selectedId = null;

    function relTime(ts) {
        const diff = Math.floor(Date.now() / 1000) - ts;
        if (diff < 60)    return `${diff}s ago`;
        if (diff < 3600)  return `${Math.floor(diff / 60)}m ago`;
        if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
        return `${Math.floor(diff / 86400)}d ago`;
    }

    function sourceBadge(src) {
        const label = {portfolio: 'Portfolio', watchlist: 'Watchlist', both: 'Both'};
        return `<span class="art-source-badge art-source-${src}">${label[src] || src}</span>`;
    }

    function sentimentBadge(label, score) {
        if (!label) return '';
        const icon = label === 'positive' ? '▲' : label === 'negative' ? '▼' : '●';
        const pct = score != null ? ` ${Math.round(Math.abs(score) * 100)}%` : '';
        return `<span class="sent-badge sent-${label}" title="Sentiment: ${label}${pct}">${icon}${pct}</span>`;
    }

    function escHtml(s) {
        if (!s) return '';
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function renderList(articles) {
        const inner = document.getElementById('articleListInner');
        const empty = document.getElementById('noArticles');
        if (!articles.length) {
            inner.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';
        inner.innerHTML = articles.map(a => `
            <div class="article-item${a.id === selectedId ? ' selected' : ''}"
                 id="art-${a.id}" onclick="selectArticle(${a.id})">
                <div class="art-headline">${escHtml(a.headline)}</div>
                <div class="art-meta">
                    <span class="art-ticker-badge">${escHtml(a.ticker)}</span>
                    ${sourceBadge(a.source_list)}
                    ${sentimentBadge(a.sentiment_label, a.sentiment_score)}
                    <span>${escHtml(a.publisher || '')}</span>
                    <span>${relTime(a.published_at)}</span>
                </div>
            </div>
        `).join('');
    }

    function filterArticles() {
        const q = document.getElementById('newsSearchInput').value.toLowerCase();
        const filtered = allArticles.filter(a => {
            const matchSrc = currentSource === 'all' || a.source_list === currentSource || a.source_list === 'both';
            const matchQ = !q
                || a.headline.toLowerCase().includes(q)
                || (a.ticker || '').toLowerCase().includes(q)
                || (a.company_name || '').toLowerCase().includes(q)
                || (a.publisher || '').toLowerCase().includes(q);
            return matchSrc && matchQ;
        });
        renderList(filtered);
    }

    function onSearch() {
        const q = document.getElementById('newsSearchInput').value;
        document.getElementById('searchClearBtn').style.display = q ? 'block' : 'none';
        filterArticles();
    }

    function clearSearch() {
        const input = document.getElementById('newsSearchInput');
        input.value = '';
        document.getElementById('searchClearBtn').style.display = 'none';
        filterArticles();
        input.focus();
    }

    function setSource(src) {
        currentSource = src;
        document.querySelectorAll('.btn-filter').forEach(b => b.classList.toggle('active', b.dataset.source === src));
        filterArticles();
    }

    function selectArticle(id) {
        selectedId = id;
        const a = allArticles.find(x => x.id === id);
        if (!a) return;

        document.querySelectorAll('.article-item').forEach(el => el.classList.remove('selected'));
        const item = document.getElementById('art-' + id);
        if (item) item.classList.add('selected');

        document.getElementById('readerPlaceholder').style.display = 'none';
        const reader = document.getElementById('readerContent');
        reader.style.display = 'block';

        // Scroll reader panel back to top whenever a new article is opened
        document.getElementById('articleReader').scrollTop = 0;

        const pubDate = new Date(a.published_at * 1000).toLocaleString();
        const bodyHtml = a.body_fetched && a.full_text
            ? `<div class="reader-body">${escHtml(a.full_text)}</div>`
            : `<div class="reader-body summary-fallback">${escHtml(a.summary || 'No summary available.')}<br><em style="font-size:0.85em;color:#666;">(Full text unavailable — open original for the complete article)</em></div>`;

        const headlineHtml = a.url
            ? `<a href="${escHtml(a.url)}" target="_blank" rel="noopener" class="reader-headline-link">${escHtml(a.headline)}</a>`
            : escHtml(a.headline);
        reader.innerHTML = `
            <h2>${headlineHtml}</h2>
            <div class="reader-meta">
                <span class="art-ticker-badge">${escHtml(a.ticker)}${a.company_name ? ' · ' + escHtml(a.company_name) : ''}</span>
                ${sourceBadge(a.source_list)}
                ${sentimentBadge(a.sentiment_label, a.sentiment_score)}
                <span>${escHtml(a.publisher || '')}</span>
                <span>${pubDate}</span>
            </div>
            ${bodyHtml}
        `;
    }

    async function loadArticles() {
        try {
            const resp = await fetch('/api/news-feed?source=all&limit=200');
            const data = await resp.json();
            allArticles = data.articles || [];
            document.getElementById('lastUpdated').textContent =
                `${allArticles.length} articles · ${new Date().toLocaleTimeString()}`;
            filterArticles();
        } catch (e) {
            console.error('Failed to load news feed:', e);
        }
    }

    async function fetchNow() {
        const btn = document.getElementById('fetchNowBtn');
        btn.disabled = true;
        btn.textContent = '⏳ Fetching...';
        try {
            await fetch('/api/news-feed/run-now', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', ...getCsrfHeaders() },
            });
            btn.textContent = '✓ Queued';
            setTimeout(() => {
                btn.textContent = '▶ Fetch Now';
                btn.disabled = false;
                loadArticles();
            }, 3000);
        } catch (e) {
            btn.textContent = '✗ Error';
            setTimeout(() => { btn.textContent = '▶ Fetch Now'; btn.disabled = false; }, 3000);
        }
    }

    function getCsrfHeaders() {
        const meta = document.querySelector('meta[name="csrf-token"]');
        return meta ? { 'X-CSRF-Token': meta.content } : {};
    }

    document.addEventListener('DOMContentLoaded', loadArticles);
</script>

<script src="/static/js/csrf.js"></script>
</body>
</html>
