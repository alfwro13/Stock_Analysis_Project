<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <title>Quantamental - Set Password</title>
    <link rel="stylesheet" href="/static/css/styles.css?v={{ css_version }}">
    <style>
        .pw-container {
            max-width: 420px;
            margin: 10vh auto;
            padding: 2rem;
            background: var(--card-bg, #1e1e2e);
            border-radius: 12px;
            border: 1px solid var(--border-color, #333);
        }
        .pw-container h2 { margin-top: 0; font-size: 1.4rem; }
        .pw-container p  { color: var(--text-muted, #aaa); font-size: 0.9rem; margin-bottom: 1.5rem; }
        .pw-field { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1rem; }
        .pw-field label { font-size: 0.85rem; color: var(--text-muted, #aaa); }
        .pw-field input {
            padding: 0.55rem 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border-color, #444);
            background: var(--input-bg, #111);
            color: inherit;
            font-size: 1rem;
        }
        .pw-submit {
            width: 100%;
            padding: 0.65rem;
            border-radius: 6px;
            border: none;
            background: #4f8ef7;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .pw-submit:hover { background: #3a75d4; }
        .pw-msg { margin-top: 1rem; font-size: 0.9rem; padding: 0.5rem 0.75rem; border-radius: 6px; display: none; }
        .pw-msg.error   { background: #3d1a1a; color: #f87171; }
        .pw-msg.success { background: #1a3d2b; color: #4ade80; }
    </style>
</head>
<body>
    <div class="pw-container">
        <h2>🔒 Set Dashboard Password</h2>
        <p>You are using the default password. Please set a new password before continuing.</p>

        <form id="pwForm" autocomplete="off">
            <div class="pw-field">
                <label for="current_password">Current password</label>
                <input type="password" id="current_password" name="current_password" required>
            </div>
            <div class="pw-field">
                <label for="new_password">New password</label>
                <input type="password" id="new_password" name="new_password" required>
            </div>
            <div class="pw-field">
                <label for="confirm_password">Confirm new password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit" class="pw-submit">Update password</button>
        </form>

        <div id="pwMsg" class="pw-msg"></div>
    </div>

    <script>
        document.getElementById('pwForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('pwMsg');
            msg.style.display = 'none';

            const body = {
                current_password: document.getElementById('current_password').value,
                new_password:     document.getElementById('new_password').value,
                confirm_password: document.getElementById('confirm_password').value,
            };

            const res = await fetch('/api/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });

            if (res.ok) {
                msg.className = 'pw-msg success';
                msg.textContent = 'Password updated. Redirecting…';
                msg.style.display = 'block';
                setTimeout(() => { window.location.href = '/'; }, 1500);
            } else {
                const data = await res.json().catch(() => ({}));
                msg.className = 'pw-msg error';
                msg.textContent = data.detail || 'Something went wrong.';
                msg.style.display = 'block';
            }
        });
    </script>
<script src="/static/js/csrf.js"></script>
</body>
</html>
