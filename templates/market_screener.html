<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <title>Quantamental - Market Screener</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
</head>
<body class="body-watchlist">

    <div class="header-container">
        <div>
            <div class="title-wrapper">
                <a href="https://github.com/alfwro13/Stock_Analysis_Project" target="_blank" class="logo-link">
                    <img src="/assets/logo_small.png" alt="Quantamental Logo" class="logo-img">
                </a>
                <h1><abbr title="Quantamental - a modern institutional strategy that combines Quantitative analysis with Fundamental analysis.">uantamental</abbr> Dashboard</h1>
            </div>
            
            <p style="color: #aaaaaa; margin-top: 5px; font-size: 14px;">Market Screener: Scanning 4,000+ US Equities</p>
            
            {% set active_page = 'market_screener' %}
                {% include 'navbar.html' %}
        </div>
    </div>

    <div style="background-color: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-top: 20px;">
        <table id="screenerTable" class="display" style="width:100%">
            <thead>
                <tr>
                    <th>Ticker</th>
                    <th>Company Name</th>
                    <th>Sector</th>
                    <th>Close Price</th>
                    <th>Volume</th>
                    <th>RSI (14)</th>
                    <th>MACD Hist</th>
                    <th>50D SMA</th>
                    <th>200D SMA</th>
                    <th>Volume Surge</th>
                    <th>Golden Cross</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <script>
        $(document).ready(function() {
            // 1. Parse URL Parameters
            const urlParams = new URLSearchParams(window.location.search);
            const targetSector = urlParams.get('sector');
            const reqBullishCross = urlParams.get('bullish_cross') === 'true';
            const reqAbove50d = urlParams.get('above_50d') === 'true';

            // 2. Render Active Filters UI Banner if parameters exist
            if (targetSector || reqBullishCross || reqAbove50d) {
                let filterLabels = [];
                if (targetSector) filterLabels.push(`Sector: ${targetSector}`);
                if (reqBullishCross) filterLabels.push('Golden MACD Crosses Only');
                if (reqAbove50d) filterLabels.push('Price > 50D SMA');
                
                const bannerHtml = `
                    <div id="activeFiltersBanner" style="background-color: #1a2636; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #00ffcc; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                        <div>
                            <strong style="color: #00ffcc;">Active Deep-Link Filters:</strong> 
                            <span style="color: #e0e0e0; margin-left: 10px; font-weight: bold;">${filterLabels.join(' &nbsp;|&nbsp; ')}</span>
                        </div>
                        <button class="btn-remove" style="padding: 8px 15px; font-weight: bold; cursor: pointer; border: none;" onclick="window.location.href='/market-screener'">✖ Clear Filters</button>
                    </div>
                `;
                $('#screenerTable').parent().prepend(bannerHtml);
            }

            // 3. Register Custom DataTables Filter
            $.fn.dataTable.ext.search.push(
                function(settings, data, dataIndex, rowData) {
                    // Check Sector match
                    if (targetSector && rowData.sector !== targetSector) {
                        return false;
                    }
                    
                    // Check Golden Cross (SQLite boolean 1/0 or True/False)
                    if (reqBullishCross && rowData.bullish_cross !== 1 && rowData.bullish_cross !== true) {
                        return false;
                    }
                    
                    // Check mathematical comparative condition (Price > 50D SMA)
                    if (reqAbove50d) {
                        const price = parseFloat(rowData.close_price);
                        const sma50 = parseFloat(rowData.sma_50);
                        if (isNaN(price) || isNaN(sma50) || price <= sma50) {
                            return false;
                        }
                    }
                    
                    return true; // Keep row if it passes all active checks
                }
            );

            // 4. Initialize DataTables
            $('#screenerTable').DataTable({
                ajax: '/api/screener-data',
                deferRender: true,
                pageLength: 25,
                order: [[0, 'asc']], // Default sort by ticker
                language: {
                    search: "🔍 Search Everything:"
                },
                columns: [
                    { 
                        data: 'ticker', 
                        render: function(data) { 
                            return '<a href="/stock/' + data + '" style="color: #4da6ff; font-weight: bold;">' + data + '</a>'; 
                        } 
                    },
                    { data: 'company_name', render: function(data) { return data || 'N/A'; } },
                    { data: 'sector', render: function(data) { return data || 'N/A'; } },
                    { 
                        data: 'close_price', 
                        render: $.fn.dataTable.render.number(',', '.', 2, '$') 
                    },
                    { 
                        data: 'volume', 
                        render: $.fn.dataTable.render.number(',', '.', 0, '') 
                    },
                    { 
                        data: 'rsi_14', 
                        render: function(data) { 
                            if (data === null || data === undefined) return 'N/A';
                            let cssClass = '';
                            if (data > 70) cssClass = 'negative-val'; // Overbought
                            else if (data < 30) cssClass = 'positive-val'; // Oversold
                            return `<span class="${cssClass}">${data.toFixed(2)}</span>`;
                        } 
                    },
                    { 
                        data: 'macd_hist', 
                        render: function(data) { 
                            if (data === null || data === undefined) return 'N/A';
                            let cssClass = data > 0 ? 'positive-val' : 'negative-val';
                            return `<span class="${cssClass}">${data.toFixed(3)}</span>`;
                        } 
                    },
                    { 
                        data: 'sma_50', 
                        render: function(data) {
                            if (data === null || data === undefined) return 'N/A';
                            return '$' + data.toFixed(2);
                        }
                    },
                    { 
                        data: 'sma_200', 
                        render: function(data) {
                            if (data === null || data === undefined) return 'N/A';
                            return '$' + data.toFixed(2);
                        }
                    },
                    { 
                        data: 'volume_surge', 
                        render: function(data) { 
                            return data ? '<span class="badge-yes">YES</span>' : '<span class="badge-no">No</span>'; 
                        } 
                    },
                    { 
                        data: 'bullish_cross', 
                        render: function(data) { 
                            return data ? '<span class="badge-yes">YES</span>' : '<span class="badge-no">No</span>'; 
                        } 
                    }
                ]
            });
        });
    </script>

</body>
</html>
